# Keeps the SHA-pinned actions in .github/workflows/zdroid_apk.yml current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # This fork's work lands on zdroid; main is its contribution to Dylan's repository.
    target-branch: zdroid
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
